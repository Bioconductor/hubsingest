name: Launch RStudio Instance

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Contributor's username (whose data to examine)"
        required: true
        type: string
      bioc_version:
        description: 'Bioconductor version (e.g., 3.22, 3.23)'
        required: false
        # Update at each Bioconductor release; input defaults cannot be expressions
        default: '3.23'
        type: string

env:
  BIOC_HUBSINGEST_PATH: "${{ github.workspace }}"
  # Keep within one minor version of the cluster's Kubernetes version
  KUBECTL_VERSION: "v1.24.17"

jobs:
  launch-rstudio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: save kubeconfig
        shell: bash
        run: mkdir -p ~/.kube && echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
      
      - name: Install Kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" && \
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" && \
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check && \
          chmod +x ./kubectl && \
          sudo mv ./kubectl /usr/local/bin/kubectl && \
          kubectl version

      - name: Set up environment
        run: |
          ACTOR_UPPER=$(echo "${{ github.actor }}" | tr '[:lower:]' '[:upper:]')
          USERNAME_LOWER=$(echo "${{ inputs.username }}" | tr '[:upper:]' '[:lower:]')
          echo "SECRET_NAME=ADMINPASS_${ACTOR_UPPER}" >> $GITHUB_ENV
          echo "USERNAME=${USERNAME_LOWER}" >> $GITHUB_ENV

      # An unset secret expands to an empty string, not an error
      - name: Check the admin password secret exists
        env:
          ADMINPASS: ${{ secrets[env.SECRET_NAME] }}
        run: |
          if [ -z "$ADMINPASS" ]; then
            echo "::error::Repository secret ${SECRET_NAME} is not set. Create it for your GitHub username in uppercase."
            exit 1
          fi
      
      - name: Launch RStudio
        env:
          ADMINPASS: ${{ secrets[env.SECRET_NAME] }}
          BIOC_VERSION_INPUT: ${{ inputs.bioc_version }}
        run: |
          bash install_hubsingest.sh
          export PATH="$PATH:$BIOC_HUBSINGEST_PATH"
          hubsingest launch_rstudio "$USERNAME" "$ADMINPASS" "$BIOC_VERSION_INPUT"

      - name: Wait for RStudio and certificate
        run: |
          kubectl wait -n "${{ env.USERNAME }}-ns" --for=condition=ready pod -l app=rstudio --timeout=7200s
          kubectl wait -n "${{ env.USERNAME }}-ns" --for=condition=ready certificate ${{ env.USERNAME }}-rstudio-tls --timeout=3600s
          echo "RStudio is available at: https://${{ env.USERNAME }}-rstudio.hubsingest.bioconductor.org"
          echo "Log in as 'rstudio' with your ADMINPASS_<GITHUB-USERNAME> value."
          echo "The contributor's S3 endpoint stays offline until versitygw is scaled back up."
          echo "Delete the endpoint when the review is finished."
