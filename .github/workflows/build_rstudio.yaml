name: Build RStudio Image

on:
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight UTC
  workflow_dispatch: {}   # Keep manual trigger without inputs

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Resolve current Bioconductor release
        id: version
        run: |
          set -euo pipefail
          BIOC_VERSION=$(curl -fsSL https://bioconductor.org/config.yaml \
            | grep -E '^release_version:' \
            | head -n1 | awk '{print $2}' | tr -d '"')
          if ! echo "$BIOC_VERSION" | grep -qE '^[0-9]+\.[0-9]+$'; then
            echo "::error::Could not read release_version from bioconductor.org/config.yaml (got '$BIOC_VERSION')"
            exit 1
          fi
          echo "Current Bioconductor release: $BIOC_VERSION"
          echo "BIOC_VERSION=$BIOC_VERSION" >> $GITHUB_OUTPUT
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BIOC_VERSION=${{ steps.version.outputs.BIOC_VERSION }}
          tags: |
            ghcr.io/bioconductor/hubsingestbiocrstudio:${{ steps.version.outputs.BIOC_VERSION }}
            ghcr.io/bioconductor/hubsingestbiocrstudio:latest
