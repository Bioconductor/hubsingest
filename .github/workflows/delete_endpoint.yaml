name: Delete Hub Ingest Endpoint

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Username of the endpoint to delete, or "ALL" to delete all endpoints'
        required: true
        type: string

env:
  BIOC_HUBSINGEST_PATH: "${{ github.workspace }}"
  # Keep within one minor version of the cluster's Kubernetes version
  KUBECTL_VERSION: "v1.24.17"

jobs:
  delete-endpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: save kubeconfig
        shell: bash
        run: mkdir -p ~/.kube && echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
      
      - name: Install Kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" && \
          curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256" && \
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check && \
          chmod +x ./kubectl && \
          sudo mv ./kubectl /usr/local/bin/kubectl && \
          kubectl version
      
      - name: Show what will be deleted
        env:
          USERNAME_INPUT: ${{ inputs.username }}
        run: |
          if [ "$USERNAME_INPUT" = "ALL" ]; then
            echo "Namespaces ending in '-ns':"
            kubectl get ns -o name | grep -- '-ns$' || echo "  (none)"
          else
            USERNAME_LOWER=$(echo "$USERNAME_INPUT" | tr '[:upper:]' '[:lower:]')
            kubectl get ns "${USERNAME_LOWER}-ns" || true
          fi

      - name: Delete endpoint
        run: |
          sudo bash install_hubsingest.sh
          export PATH="$PATH:$BIOC_HUBSINGEST_PATH"
          if [ "${{ inputs.username }}" = "ALL" ]; then
            hubsingest delete_endpoint "ALL"
          else
            USERNAME_LOWER=$(echo "${{ inputs.username }}" | tr '[:upper:]' '[:lower:]')
            hubsingest delete_endpoint "${USERNAME_LOWER}"
          fi
