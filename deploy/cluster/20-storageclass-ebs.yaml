---
# Example for the AWS EBS CSI driver. Endpoint PVCs request the class name
# `ebs`; on another cloud keep the name and change the provisioner and
# parameters. With reclaimPolicy Delete, deleting an endpoint deletes its volume.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
