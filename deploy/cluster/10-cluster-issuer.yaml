---
# ACME issuer for every endpoint certificate. HTTP-01 is answered through the
# ingress controller, so it works with any DNS provider.
# Let's Encrypt sends no expiry notices; the email is the account contact.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_CONTACT_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: ${HUBSINGEST_INGRESS_CLASS}
---
# Staging issuer for tests: higher rate limits, untrusted certificates
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ${ACME_CONTACT_EMAIL}
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: ${HUBSINGEST_INGRESS_CLASS}
