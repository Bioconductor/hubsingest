---
# cert-manager names the Certificate after secretName; create_endpoint.yaml
# waits for that name. proxy-body-size caps a single PUT request.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: versitygw
  annotations:
    cert-manager.io/cluster-issuer: ${HUBSINGEST_CLUSTER_ISSUER}
    kubernetes.io/tls-acme: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: '${HUBSINGEST_MAX_BODY_SIZE}'
spec:
  ingressClassName: ${HUBSINGEST_INGRESS_CLASS}
  tls:
    - hosts:
        - ${HUBSINGEST_USER}.${HUBSINGEST_DOMAIN}
      secretName: ${HUBSINGEST_USER}-hubsingest-bioconductor-org-key
  rules:
  - host: ${HUBSINGEST_USER}.${HUBSINGEST_DOMAIN}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: versitygw
            port:
              number: 80
